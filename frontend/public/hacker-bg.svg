<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" fill="none">
  <defs>
    <radialGradient id="room" cx="51%" cy="47%" r="73%">
      <stop stop-color="#12333d" stop-opacity=".56"/>
      <stop offset=".48" stop-color="#06141e" stop-opacity=".8"/>
      <stop offset="1" stop-color="#01050b"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="57%">
      <stop stop-color="#0cb2c1" stop-opacity=".23"/>
      <stop offset=".55" stop-color="#075267" stop-opacity=".1"/>
      <stop offset="1" stop-color="#03111a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1=".25" y1=".08" x2=".78" y2=".92">
      <stop stop-color="#154452"/>
      <stop offset=".25" stop-color="#102b37"/>
      <stop offset=".7" stop-color="#07141e"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="edge" x1=".18" y1=".25" x2=".85" y2=".8">
      <stop stop-color="#1ad3df" stop-opacity=".64"/>
      <stop offset=".35" stop-color="#176879" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0a1b25" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="torso" x1=".1" y1=".12" x2=".86" y2=".85">
      <stop stop-color="#173743"/>
      <stop offset=".34" stop-color="#0b1d28"/>
      <stop offset="1" stop-color="#030910"/>
    </linearGradient>
    <linearGradient id="screen" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#122c35"/>
      <stop offset=".55" stop-color="#08151e"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#16b8d0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#17b9d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1477c2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
  </defs>

  <path fill="url(#room)" d="M0 0h1920v900H0z"/>
  <ellipse cx="964" cy="429" rx="558" ry="425" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M0 199h1920" stroke="url(#beam)" stroke-opacity=".14"/>
  <path d="M0 622h1920" stroke="url(#beam)" stroke-opacity=".12"/>
  <g opacity=".24" filter="url(#soft)">
    <path d="M1490 229h308" stroke="#167db6" stroke-width="8"/>
    <path d="M92 508h420" stroke="#0aa5b7" stroke-width="7"/>
  </g>

  <!-- Hood and shoulders, kept low contrast so the login panel remains the focus. -->
  <g filter="url(#grain)">
    <path d="M428 900c23-135 75-242 174-318 69-53 137-87 214-110l45-30 67 4 78 29c89 26 170 66 238 130 75 72 131 172 164 295H428Z" fill="url(#torso)"/>
    <path d="M483 900c29-139 80-238 161-297 51-37 116-73 195-97l71 16 75-14c89 25 166 68 224 120 62 56 112 145 145 272H483Z" fill="url(#edge)" opacity=".43"/>
    <path d="M750 458c-9-66-2-148 23-230C801 123 858 48 953 22c96 26 153 100 181 205 23 84 28 157 18 229-18 111-94 180-198 192-105-12-185-79-204-190Z" fill="url(#hood)" stroke="#1a6a78" stroke-opacity=".5" stroke-width="5"/>
    <path d="M806 438c-1-93 13-177 47-240 25-47 60-82 101-107 44 24 80 61 105 110 32 63 45 147 40 236-7 76-62 129-143 138-82-8-142-61-150-137Z" fill="#030a11"/>
    <path d="M804 451c-26-56-39-126-26-205 11-66 41-132 89-178 26-26 54-42 86-51-85 59-131 133-150 225-16 76-13 148 1 209Z" fill="#2b7884" opacity=".24"/>
    <path d="M1101 452c27-56 40-126 27-205-11-66-42-132-89-178-25-25-55-42-86-51 85 59 131 133 150 225 16 76 12 148-2 209Z" fill="#2c7b88" opacity=".26"/>
    <path d="M806 420c31 41 78 62 147 64 68-2 116-23 146-64" stroke="#174b57" stroke-width="16" opacity=".42"/>
    <path d="M530 900c24-112 68-207 136-273 32-31 73-58 124-80-51 73-77 174-83 353H530Z" fill="#07131d" opacity=".72"/>
    <path d="M1379 900c-24-112-68-207-136-273-32-31-73-58-124-80 51 73 77 174 83 353h177Z" fill="#07131d" opacity=".72"/>
    <path d="M720 482c-89 40-163 95-224 169-49 60-85 139-105 249h206c14-119 44-205 95-268 35-43 75-79 121-107l-93-43Z" fill="url(#torso)" stroke="#165562" stroke-opacity=".3" stroke-width="4"/>
    <path d="M1187 482c89 40 163 95 224 169 49 60 85 139 105 249h-206c-14-119-44-205-95-268-35-43-75-79-121-107l93-43Z" fill="url(#torso)" stroke="#165562" stroke-opacity=".3" stroke-width="4"/>
  </g>

  <!-- Laptop glow and screen at the bottom of frame. -->
  <path d="M786 483c0-18 15-33 33-33h293c18 0 33 15 33 33v417H786V483Z" fill="url(#screen)" stroke="#1b5d69" stroke-opacity=".52" stroke-width="5"/>
  <path d="M797 491h337v409H797z" fill="#061019" fill-opacity=".25"/>
  <path d="M797 491h337" stroke="#53d2d7" stroke-opacity=".2" filter="url(#glow)"/>
  <path d="M763 900h404" stroke="#0eb6c5" stroke-opacity=".16" stroke-width="3"/>

  <rect width="1920" height="900" fill="#01050b" fill-opacity=".12"/>
</svg>
